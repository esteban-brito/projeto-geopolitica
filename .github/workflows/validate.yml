# O portão. Ele roda exatamente `npm run validate` — as mesmas guardas, tipos,
# lint, formato, suítes e PASSEIO que rodam na máquina de quem escreve.
#
# O passeio entrou no portão em 23/08/2026, e o número que decidiu isso é a
# assimetria de cobertura: motor e tela têm o mesmo tamanho — 8.007 contra 9.601
# linhas — e o motor tinha 207 provas contra 29 da tela, todas lendo string. As
# 38 checagens que de fato veem geometria e contraste moram aqui, e estavam fora
# do portão. Custo medido: 9s para 42s.
#
# `npm run screen` NÃO entra aqui, e não é esquecimento: ele abre um Chromium
# COM JANELA e mede fps contra a taxa do monitor. Num runner sem GPU os dois
# braços caem juntos e o número mente — foi por medir assim que a primeira
# versão da suíte deu o material 8 fps mais rápido que o controle. Medição de
# tela continua sendo local, com GPU, e por decisão.
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # A mesma versão do `.nvmrc`, para o CI não provar coisa diferente do
          # que a máquina de quem escreve prova.
          node-version-file: .nvmrc
          cache: npm

      # `ci` e não `install`: ele instala do lock e falha se o lock divergir do
      # package.json, que é a única forma de o CI garantir a mesma arvore.
      - run: npm ci

      # O NAVEGADOR É DEPENDÊNCIA DO PORTÃO desde que o passeio entrou nele.
      # Só o chromium: o passeio abre um só, e baixar os três triplicaria o
      # tempo de instalação para provar exatamente a mesma coisa.
      - run: npx playwright install --with-deps chromium

      - run: npm run validate
