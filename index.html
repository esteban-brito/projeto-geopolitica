<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Planalto — painel do mês</title>
    <meta name="color-scheme" content="dark" />
    <!-- Icone embutido como data URI: sem ele o navegador pede `/favicon.ico` e
         toma um 404 — que a suite de custo acusa, e com razao. Filtro de ruido
         numa guarda de console e como um 404 real sobrevive meses. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23090d15'/%3E%3Cpath d='M16 6l9 10-9 10-9-10z' fill='%23e8a33d'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Simulador de presidência: política, economia e opinião pública em um grafo de causas e efeitos."
    />

    <!-- A ORDEM DESTAS TAGS IMPORTA POR UM MOTIVO SO, e nao pelo que se imagina.
         A precedencia entre as camadas e declarada por `@layer` dentro de
         `00-tokens.css`, entao uma regra de `components` nunca vence uma de
         `screens` por acidente de carregamento. Mas a ORDEM DAS CAMADAS e
         fixada pela primeira vez em que sao mencionadas — se outro arquivo
         chegasse antes do de tokens, ele registraria a propria camada primeiro
         e inverteria a hierarquia inteira.
         Por isso `00-tokens.css` vem primeiro, e por isso a numeracao existe:
         ela e a ordem verdadeira, visivel no nome do arquivo.
         `tests/guards/cascade.mjs` prova as quatro coisas: o primeiro link e o
         de tokens, ele declara a ordem, os arquivos estao em sequencia, e
         nenhuma regra do projeto vive fora de uma camada. -->
    <link rel="stylesheet" href="styles/00-tokens.css" />
    <link rel="stylesheet" href="styles/10-base.css" />
    <link rel="stylesheet" href="styles/20-material.css" />
    <link rel="stylesheet" href="styles/30-components.css" />
    <link rel="stylesheet" href="styles/40-shell.css" />
    <link rel="stylesheet" href="styles/50-screen-mesa.css" />
    <link rel="stylesheet" href="styles/60-screen-area.css" />
    <link rel="stylesheet" href="styles/70-screen-approval.css" />
    <link rel="stylesheet" href="styles/90-motion.css" />
  </head>

  <body>
    <!-- O GRAFO E O SUBSTRATO, e agora ele cobre a JANELA inteira e nao so a
         area de conteudo: o rail tambem e vidro, e vidro sobre nada nao refrata.
         Sem conteudo estruturado atras, `backdrop-filter` vira custo de GPU sem
         imagem. -->
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>

    <div class="shell">
      <!-- ═══ O RAIL — navegacao primaria, na estrutura do FM2020 ═══════════
           Icone a esquerda, rotulo ao lado, item corrente destacado, e um bloco
           ancorado no rodape. As acoes de turno vivem nesse rodape: no FM o
           `Continue` fica no canto superior direito, e a divergencia e o pedido
           explicito de botao a esquerda. -->
      <nav class="rail glass-support" aria-label="Seções do governo">
        <p class="rail__mark">Planalto</p>
        <ul class="rail__list" id="railNav"></ul>

        <div class="rail__foot">
          <!-- O TEXTO DOS BOTOES VEM DE `src/ui/strings.mjs`, e nao daqui: a
               mesma frase em dois lugares é a frase que diverge no primeiro
               ajuste, e o arquivo de textos existe justamente para não haver o
               segundo lugar. O que fica no documento é a CAIXA.
               Ele nasce desligado porque no primeiro mês não existe relatório
               anterior — botão que abre o vazio ensina a desconfiar do menu. -->
          <button class="action glass-action" id="review" type="button" disabled></button>
          <!-- RECOMECAR PEDE CONFIRMACAO NO PROPRIO BOTAO. Ele apaga um mandato
               inteiro, e fica ao lado de um botao que se aperta toda hora: sem
               dois passos, o custo de errar o alvo e a partida. -->
          <button class="action action--quiet" id="restart" type="button"></button>
        </div>
      </nav>

      <!-- ═══ O TABULEIRO — a tela corrente, e ela inteira ═══════════════════
           Ele nasce VAZIO e e substituido por completo a cada pintura: a Mesa e
           as seis areas sao conteudos deste mesmo lugar, e nao paineis que se
           escondem um atras do outro.
           A consequencia esta escrita aqui porque ela ja custou caro: NADA que
           precise sobreviver a troca de tela pode morar dentro deste elemento.
           O veredito morava, e por isso desceu para o rail da direita — de la
           ele atravessa a troca sem ser reconstruido. -->
      <main class="board" id="main"></main>

      <!-- ═══ O RAIL DA DIREITA — a MESMA peca, espelhada ═══════════════════
           Mesma largura, mesma lamina, mesma margem, mesmo raio, mesmo rodape
           ancorado. So o CONTEUDO difere: a esquerda navega, a direita lê e
           avanca. Duas laminas com construcao diferente seriam dois materiais,
           e o sistema inteiro existe para impedir isso.
           E aqui a referencia volta ao lugar: no FM2020 a data fica no canto
           superior direito e o `Continue` ao lado dela. -->
      <aside class="rail glass-support" aria-label="Indicadores do mês">
        <p class="rail__mark" id="turn"></p>
        <div class="strip strip--stacked" id="context"></div>

        <!-- A SEGUNDA LEITURA: a unica frase que diz o que esta em jogo. Aqui
             ela perde a lamina que tinha na tela anterior — o rail JA e vidro,
             e vidro sobre vidro sao dois materiais empilhados no lugar de um. -->
        <p class="verdict" id="verdict"></p>

        <div class="rail__foot">
          <button class="action action--primary glass-action" id="advance" type="button"></button>
        </div>
      </aside>
    </div>

    <!-- O <dialog> NATIVO. Foco, inercia do fundo, Escape e camada superior sao
         do navegador. Nao ha laco de foco escrito a mao, nao ha `inert` aplicado
         por JavaScript e nao ha listener de tecla: era exatamente esse conjunto
         que, feito a mao no projeto anterior, produziu quatro barreiras de
         acessibilidade e tres regras permanentes de documentacao. -->
    <dialog id="monthDialog" aria-labelledby="monthDialogTitle">
      <div class="glass-stage dialog-card">
        <!-- O TITULO VEM DE DENTRO. `aria-labelledby` aponta para um `id` que a
             view escreve, e não para um título fixo aqui: o cartão inteiro é
             substituído a cada mês, e um título parado no documento passaria a
             descrever o mês anterior para quem lê por leitor de tela — a única
             pessoa que não veria a diferença. -->
        <div class="report" id="monthReport"></div>
        <button class="action glass-action" id="monthDialogClose" type="button"></button>
      </div>
    </dialog>

    <script type="module" src="app.mjs"></script>
  </body>
</html>
