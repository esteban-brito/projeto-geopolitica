<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>República Simulator — painel do mês</title>
    <meta name="color-scheme" content="dark" />
    <!-- Icone embutido como data URI: sem ele o navegador pede `/favicon.ico` e
         toma um 404 — que a suite de custo acusa, e com razao. Filtro de ruido
         numa guarda de console e como um 404 real sobrevive meses. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23090d15'/%3E%3Cpath d='M16 6l9 10-9 10-9-10z' fill='%23e8a33d'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Simulador de presidência: política, economia e opinião pública em um grafo de causas e efeitos."
    />

    <!-- A ORDEM DESTAS TAGS IMPORTA POR UM MOTIVO SO, e nao pelo que se imagina.
         A precedencia entre as camadas e declarada por `@layer` dentro de
         `00-tokens.css`, entao uma regra de `components` nunca vence uma de
         `screens` por acidente de carregamento. Mas a ORDEM DAS CAMADAS e
         fixada pela primeira vez em que sao mencionadas — se outro arquivo
         chegasse antes do de tokens, ele registraria a propria camada primeiro
         e inverteria a hierarquia inteira.
         Por isso `00-tokens.css` vem primeiro, e por isso a numeracao existe:
         ela e a ordem verdadeira, visivel no nome do arquivo.
         `tests/guards/cascade.mjs` prova as quatro coisas: o primeiro link e o
         de tokens, ele declara a ordem, os arquivos estao em sequencia, e
         nenhuma regra do projeto vive fora de uma camada. -->
    <link rel="stylesheet" href="styles/00-tokens.css" />
    <link rel="stylesheet" href="styles/10-base.css" />
    <link rel="stylesheet" href="styles/20-material.css" />
    <link rel="stylesheet" href="styles/30-components.css" />
    <link rel="stylesheet" href="styles/40-shell.css" />
    <link rel="stylesheet" href="styles/45-screen-cabinet.css" />
    <link rel="stylesheet" href="styles/50-screen-mesa.css" />
    <link rel="stylesheet" href="styles/60-screen-area.css" />
    <link rel="stylesheet" href="styles/65-screen-finance.css" />
    <link rel="stylesheet" href="styles/70-screen-closing.css" />
    <link rel="stylesheet" href="styles/90-motion.css" />
  </head>

  <body>
    <!-- O GRAFO E O SUBSTRATO, e agora ele cobre a JANELA inteira e nao so a
         area de conteudo: o rail tambem e vidro, e vidro sobre nada nao refrata.
         Sem conteudo estruturado atras, `backdrop-filter` vira custo de GPU sem
         imagem. -->
    <div class="backdrop" id="backdrop" aria-hidden="true"></div>

    <div class="shell" id="shell">
      <!-- ═══ A BARRA SUPERIOR — o sinal vital, e ele nunca some ═════════════
           A referencia e o Football Manager: status a esquerda, indicadores no
           meio, e a acao de avancar a direita, sempre no mesmo lugar. Ela
           substitui o rail da direita inteiro — que carregava data, contexto,
           veredito e o botao — e ganha o que faltava: PIB e inflacao, que so
           existiam dentro de Financas.

           OS QUATRO INDICADORES TEM MOTOR. A aprovacao foi a ultima a ter, em
           14/08/2026, e e por isso que esta barra so nasceu agora: com um quarto
           do conteudo inventado, ela ensinaria a desconfiar dos outros tres. -->
      <header class="topbar glass-support">
        <div class="topbar__zone">
          <span class="topbar__brand">
            <span class="topbar__seal" id="seal" aria-hidden="true"></span>
            <span class="topbar__name"><b>República</b><b>Simulator</b></span>
          </span>
        </div>

        <!-- O CACHO — as tres pecas encostadas. Juntas elas sao uma pergunta so: em que mes
             estamos, o que o pais diz, e o que fazer agora. A marca fica sozinha do outro
             lado, e o vao entre as duas e o preco declarado dessa composicao. -->
        <div class="topbar__cluster">
          <span class="piece piece--vitals">
            <span class="topbar__vitals" id="vitals"></span>
          </span>
          <span class="piece piece--when" id="turn"></span>
          <span class="go-env topbar__act">
            <span class="go-float">
              <span class="go-shade"></span>
              <span class="go-shade--high"></span>
              <button class="go go--glass" id="advance" type="button">
                <span class="go__edge"></span>
                <span class="go__warm"></span>
                <span class="go__stack">
                  <span class="go__label"></span>
                  <span class="go__hint"></span>
                  <span class="go__arrow" id="advanceArrow" aria-hidden="true"></span>
                </span>
              </button>
            </span>
          </span>
        </div>
      </header>

      <!-- ═══ A SIDEBAR — poderes e lugares, e as areas um nivel abaixo ══════
           Ela ja foi organizada por motor, por instrumento e por area de
           governo. A quarta forma nao e uma volta atras: legislar deixou de ser
           um RITO e virou uma ATIVIDADE, entao o Congresso deixa de ser o "como"
           de uma decisao de saude e passa a ser um lugar onde se passa o mes. -->
      <nav class="rail glass-support" aria-label="Seções do governo">
        <!-- ⚠ QUEM É VOCÊ. Até 15/08/2026 o jogo nunca dizia de quem era o
             mandato: a barra anunciava "1º MANDATO · ANO 1" e o jogador era a
             única pessoa sem nome num jogo em que sete outras tinham. Aqui entram
             o nome do presidente e a posição que o governo SE TORNOU — derivada do
             que ele moveu, nunca escolhida, que é a regra do ciclo 2. O conteúdo
             vem de `governmentOf`; este elemento é só o lugar. -->
        <div class="rail__gov" id="railGov"></div>
        <ul class="rail__list" id="railNav"></ul>

        <div class="rail__foot">
          <!-- RECOMECAR PEDE CONFIRMACAO NO PROPRIO BOTAO. Ele apaga um mandato
               inteiro: sem dois passos, o custo de errar o alvo e a partida. -->
          <button class="action action--quiet" id="restart" type="button"></button>
        </div>
      </nav>

      <!-- ═══ O TABULEIRO — a tela corrente, e ela inteira ═══════════════════
           Ele nasce VAZIO e e substituido por completo a cada pintura.
           ⚠ NADA que precise sobreviver a troca de tela pode morar aqui dentro.
           O veredito morava, desceu para o rail da direita, e agora subiu para o
           Gabinete — que e a tela do governo inteiro, e o lugar certo dele. -->
      <main class="board" id="main"></main>
    </div>

    <!-- O <dialog> NATIVO, E AGORA SO PARA O AVISO. Foco, inercia do fundo,
         Escape e camada superior sao do navegador. Nao ha laco de foco escrito a
         mao, nao ha `inert` aplicado por JavaScript e nao ha listener de tecla:
         era exatamente esse conjunto que, feito a mao no projeto anterior,
         produziu quatro barreiras de acessibilidade e tres regras permanentes de
         documentacao.

         O RELATORIO DO MES SAIU DAQUI. Ele é informação que se consulta, e o
         modal a transformava em pedágio: um clique por mês, 48 por mandato, e o
         fundo inerte impedia comparar o relatório com a Mesa que o produziu.
         Interrupção é para quando algo deu errado — que é o caso do aviso. -->
    <!-- A POSSE — onde o jogador escreve o proprio nome.
         ⚠ O TRATAMENTO E PERGUNTADO, e nao deduzido do nome: com o nome DIGITADO nao ha
         de onde deduzir, e a interface tem sete frases que dependem dele. Ate 22/08/2026
         elas diziam "o senhor" para todo mundo. -->
    <dialog id="swearDialog" aria-labelledby="swearTitle">
      <form class="glass-stage dialog-card swear" id="swearForm" method="dialog">
        <h2 class="block__legend" id="swearTitle"></h2>
        <label class="swear__field">
          <span id="swearNameLabel"></span>
          <input
            class="swear__input"
            id="swearName"
            type="text"
            maxlength="40"
            autocomplete="off"
            required
          />
        </label>
        <!-- ⚠ NAO EXISTE PRESIDENTE SEM PARTIDO: filiacao e condicao de elegibilidade (CF
             art. 14, §3º, V) e o STF afastou a candidatura avulsa. A lista sai do catalogo,
             e nao daqui — nove opcoes escritas a mao seriam uma segunda verdade sobre
             quantas bancadas o jogo tem. -->
        <label class="swear__field">
          <span id="swearPartyLabel"></span>
          <select class="swear__input" id="swearParty" required></select>
        </label>
        <p class="swear__hint" id="swearPartyHint"></p>
        <fieldset class="swear__how">
          <legend id="swearHowLabel"></legend>
          <label class="swear__pick">
            <input type="radio" name="treatment" value="senhor" checked />
            <span id="swearSir"></span>
          </label>
          <label class="swear__pick">
            <input type="radio" name="treatment" value="senhora" />
            <span id="swearMadam"></span>
          </label>
        </fieldset>
        <div class="swear__feet">
          <button class="action action--quiet" id="swearCancel" type="button"></button>
          <button class="action glass-action" id="swearOk" type="submit"></button>
        </div>
      </form>
    </dialog>

    <dialog id="noticeDialog" aria-labelledby="noticeTitle">
      <div class="glass-stage dialog-card">
        <!-- O TITULO VEM DE DENTRO. `aria-labelledby` aponta para um `id` que a
             view escreve, e não para um título fixo aqui: o cartão inteiro é
             substituído a cada aviso, e um título parado no documento passaria a
             descrever o aviso anterior para quem lê por leitor de tela — a única
             pessoa que não veria a diferença. -->
        <div class="report" id="noticeSlot"></div>
        <button class="action glass-action" id="noticeClose" type="button"></button>
      </div>
    </dialog>

    <script type="module" src="app.mjs"></script>
  </body>
</html>
