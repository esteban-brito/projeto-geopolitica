<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid Glass Lab</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/lab/styles.css" />
  </head>
  <body>
    <main class="lab">
      <canvas id="stage" aria-label="Vidros sobre a cena de teste. Arraste para mover."></canvas>
      <div class="selection" id="selection" aria-hidden="true"></div>

      <header class="topbar">
        <span class="brand">Liquid Glass Lab <span class="brand__tag">V3</span></span>
        <button class="pill" id="stats" type="button" aria-expanded="false" aria-controls="stats-card">—</button>
      </header>
      <section class="card stats-card" id="stats-card" hidden aria-label="Desempenho"></section>

      <p class="coach" id="coach">Arraste um vidro · solte perto do outro para fundir · clique duas vezes para ajustar</p>
      <nav class="dock" id="dock" aria-label="Cena, forma e material"></nav>

      <aside class="drawer" id="drawer" hidden aria-label="Ajustes">
        <header class="drawer__head">
          <div>
            <strong>Ajustes</strong>
            <span class="drawer__subject" id="drawer-subject"></span>
          </div>
          <button class="icon-button" id="drawer-close" type="button" aria-label="Fechar ajustes"></button>
        </header>
        <div class="drawer__body" id="drawer-body"></div>
      </aside>

      <div class="card notice" id="notice" hidden></div>
      <pre class="shader-error" id="shader-error" hidden></pre>
    </main>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
